<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090b10">

<title>Minha Estante</title>

<style>
:root{
    --bg:#090b10;
    --sidebar:#0c0f15;
    --card:#151923;
    --card2:#1c212c;
    --border:rgba(255,255,255,.075);
    --text:#f5f7fb;
    --muted:#9299a8;
    --muted2:#646d7e;
    --primary:#ff5a36;
    --primary2:#ff7a4f;
    --green:#3ddc84;
    --blue:#6b95ff;
    --yellow:#ffc857;
    --radius:16px;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
    margin:0;
    min-height:100vh;
    color:var(--text);
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:
        radial-gradient(circle at 100% 0,rgba(255,90,54,.07),transparent 28%),
        radial-gradient(circle at 0 100%,rgba(91,140,255,.05),transparent 30%),
        var(--bg);
}

button,input,select{font:inherit}
button{cursor:pointer}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:240px;
    z-index:50;
    overflow-y:auto;
    padding:27px 18px;
    border-right:1px solid var(--border);
    background:rgba(12,15,21,.97);
    backdrop-filter:blur(18px);
}

.logo{
    display:flex;
    gap:12px;
    align-items:center;
    padding:0 7px;
    margin-bottom:34px;
    font-size:22px;
    font-weight:850;
}

.logo-icon{
    width:43px;
    height:43px;
    display:grid;
    place-items:center;
    border-radius:13px;
    font-size:21px;
    flex-shrink:0;
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    box-shadow:0 10px 28px rgba(255,90,54,.22);
}

.logo span{color:var(--primary)}

.menu-label{
    margin:25px 11px 9px;
    font-size:10px;
    font-weight:850;
    letter-spacing:1.5px;
    color:#606879;
}

.menu-item{
    width:100%;
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:4px;
    padding:12px 13px;
    border:0;
    border-radius:11px;
    color:var(--muted);
    background:transparent;
    text-align:left;
    transition:.18s;
}

.menu-item:hover{
    color:#fff;
    background:rgba(255,255,255,.04);
}

.menu-item.active{
    color:#fff;
    background:linear-gradient(90deg,rgba(255,90,54,.16),rgba(255,90,54,.04));
}

.menu-icon{
    width:23px;
    text-align:center;
    font-size:17px;
}

/* =========================
   MAIN / HEADER
========================= */

.main{
    min-height:100vh;
    margin-left:240px;
}

.header{
    position:sticky;
    top:0;
    z-index:30;
    min-height:78px;
    display:flex;
    align-items:center;
    gap:15px;
    padding:16px 30px;
    background:rgba(9,11,16,.88);
    border-bottom:1px solid var(--border);
    backdrop-filter:blur(20px);
}

.mobile-menu{
    display:none;
    width:43px;
    height:43px;
    border:1px solid var(--border);
    border-radius:11px;
    background:var(--card);
    color:#fff;
}

.search-box{
    width:100%;
    max-width:520px;
    position:relative;
}

.search-icon{
    position:absolute;
    left:16px;
    top:50%;
    transform:translateY(-50%);
    opacity:.55;
}

.search-box input{
    width:100%;
    padding:13px 15px 13px 45px;
    color:#fff;
    outline:none;
    border:1px solid var(--border);
    border-radius:13px;
    background:#141821;
}

.search-box input:focus{
    border-color:rgba(255,90,54,.45);
    box-shadow:0 0 0 3px rgba(255,90,54,.06);
}

.header-actions{
    margin-left:auto;
    display:flex;
    gap:9px;
}

.action-button{
    display:flex;
    align-items:center;
    gap:7px;
    padding:11px 15px;
    white-space:nowrap;
    border:1px solid var(--border);
    border-radius:11px;
    background:#171b24;
    color:#fff;
    font-weight:700;
}

.action-button:hover{background:#202631}

.action-button.primary{
    border-color:transparent;
    background:linear-gradient(135deg,var(--primary),var(--primary2));
}

/* =========================
   CONTEÚDO
========================= */

.content{
    max-width:1650px;
    margin:auto;
    padding:34px 34px 70px;
}

.page-heading{margin-bottom:28px}

.page-heading h1{
    margin:0 0 7px;
    font-size:clamp(27px,3vw,39px);
    letter-spacing:-.7px;
}

.page-heading p{
    margin:0;
    color:var(--muted);
}

/* =========================
   ESTATÍSTICAS
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,minmax(150px,1fr));
    gap:15px;
    margin-bottom:28px;
}

.stat-card{
    min-height:120px;
    padding:20px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:linear-gradient(145deg,rgba(255,255,255,.05),rgba(255,255,255,.017));
}

.stat-label{
    margin-bottom:8px;
    font-size:13px;
    color:var(--muted);
}

.stat-number{
    font-size:30px;
    font-weight:900;
}

.stat-detail{
    margin-top:5px;
    font-size:11px;
    color:var(--muted2);
}

/* =========================
   FILTROS
========================= */

.toolbar{
    display:flex;
    align-items:center;
    gap:9px;
    flex-wrap:wrap;
    margin-bottom:23px;
}

.chip{
    padding:8px 14px;
    border:1px solid var(--border);
    border-radius:100px;
    background:#131720;
    color:var(--muted);
}

.chip:hover{color:#fff}

.chip.active{
    color:#ff8a68;
    border-color:rgba(255,90,54,.35);
    background:rgba(255,90,54,.13);
}

.toolbar-right{margin-left:auto}

.sort-select{
    padding:9px 12px;
    color:#fff;
    outline:none;
    border:1px solid var(--border);
    border-radius:10px;
    background:#131720;
}

/* =========================
   GRID
========================= */

.library-grid,
.subcollection-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(175px,1fr));
    gap:25px 20px;
}

.collection-card{
    min-width:0;
    cursor:pointer;
    transition:transform .2s;
}

.collection-card:hover{transform:translateY(-6px)}

.cover{
    position:relative;
    overflow:hidden;
    aspect-ratio:2/3;
    border:1px solid var(--border);
    border-radius:16px;
    background:var(--card);
    box-shadow:0 12px 30px rgba(0,0,0,.27);
}

.collection-card:hover .cover{
    box-shadow:0 20px 45px rgba(0,0,0,.42);
}

.cover img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
}

.cover-placeholder{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:17px;
    text-align:center;
    background:
        radial-gradient(circle at 30% 20%,rgba(255,90,54,.20),transparent 32%),
        linear-gradient(145deg,#222835,#11141b);
}

.placeholder-icon{
    margin-bottom:15px;
    font-size:42px;
}

.placeholder-name{
    font-size:13px;
    font-weight:750;
    line-height:1.4;
    color:#dde1e9;
}

.cover-count{
    position:absolute;
    left:10px;
    top:10px;
    padding:5px 8px;
    font-size:10px;
    font-weight:850;
    border-radius:8px;
    background:rgba(0,0,0,.75);
    backdrop-filter:blur(8px);
}

.cover-sub{
    position:absolute;
    right:10px;
    bottom:10px;
    padding:5px 8px;
    font-size:10px;
    font-weight:800;
    border-radius:8px;
    background:rgba(0,0,0,.75);
}

.cover-star{
    position:absolute;
    right:10px;
    top:10px;
    width:32px;
    height:32px;
    display:grid;
    place-items:center;
    border-radius:50%;
    background:rgba(0,0,0,.72);
}

.collection-info{padding:11px 3px 0}

.collection-title{
    margin-bottom:5px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    font-size:14px;
    font-weight:750;
}

.collection-meta{
    color:var(--muted);
    font-size:11px;
}

.progress-bar{
    width:100%;
    height:5px;
    margin-top:9px;
    overflow:hidden;
    border-radius:100px;
    background:#272c37;
}

.progress-fill{
    height:100%;
    border-radius:inherit;
    background:linear-gradient(90deg,var(--primary),var(--primary2));
}

/* =========================
   ESTADOS
========================= */

.state{
    grid-column:1/-1;
    padding:90px 20px;
    color:var(--muted);
    text-align:center;
}

.state-icon{
    margin-bottom:14px;
    font-size:48px;
}

.loader{
    width:39px;
    height:39px;
    margin:0 auto 16px;
    border:3px solid rgba(255,255,255,.08);
    border-top-color:var(--primary);
    border-radius:50%;
    animation:spin .75s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

/* =========================
   MODAL
========================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
    padding:22px;
    overflow-y:auto;
    background:rgba(3,5,9,.90);
    backdrop-filter:blur(10px);
}

.modal.open{
    display:flex;
    justify-content:center;
    align-items:flex-start;
}

.modal-box{
    width:100%;
    max-width:1120px;
    margin:auto;
    overflow:hidden;
    border:1px solid var(--border);
    border-radius:21px;
    background:#11151d;
    box-shadow:0 30px 90px rgba(0,0,0,.55);
}

.modal-header{
    display:flex;
    align-items:center;
    gap:14px;
    padding:22px 27px;
    border-bottom:1px solid var(--border);
}

.modal-back{
    display:none;
    width:42px;
    height:42px;
    flex-shrink:0;
    border:1px solid var(--border);
    border-radius:11px;
    background:#1b202a;
    color:#fff;
    font-size:20px;
}

.modal-back.show{display:block}

.modal-title-container{
    flex:1;
    min-width:0;
}

.breadcrumb{
    margin-bottom:6px;
    color:#737c8d;
    font-size:11px;
}

.modal-title{
    margin:0 0 4px;
    overflow:hidden;
    text-overflow:ellipsis;
    font-size:25px;
}

.modal-subtitle{
    color:var(--muted);
    font-size:12px;
}

.close-button{
    width:42px;
    height:42px;
    flex-shrink:0;
    border:1px solid var(--border);
    border-radius:11px;
    background:#1b202a;
    color:#fff;
    font-size:21px;
}

.modal-body{padding:24px 27px}

/* =========================
   SEÇÕES MODAL
========================= */

.modal-section{margin-bottom:30px}

.section-title-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:15px;
}

.section-title{
    margin:0;
    font-size:17px;
}

.section-count{
    font-size:11px;
    color:var(--muted);
}

.empty-inline{
    padding:20px;
    color:var(--muted);
    text-align:center;
    border:1px dashed var(--border);
    border-radius:13px;
}

/* =========================
   EDIÇÕES
========================= */

.edition{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:9px;
    padding:15px;
    border:1px solid var(--border);
    border-radius:14px;
    background:#161a22;
}

.edition:hover{background:#191e27}

.edition-icon{
    width:44px;
    height:55px;
    display:grid;
    place-items:center;
    flex-shrink:0;
    border-radius:9px;
    background:#252b37;
    font-size:21px;
}

.edition-content{
    flex:1;
    min-width:0;
}

.edition-name{
    margin-bottom:4px;
    overflow:hidden;
    text-overflow:ellipsis;
    font-size:13px;
    font-weight:750;
}

.edition-meta{
    font-size:11px;
    color:var(--muted);
}

.status{
    display:inline-block;
    margin-top:7px;
    padding:4px 7px;
    border-radius:100px;
    font-size:9px;
    font-weight:900;
    text-transform:uppercase;
}

.status.nao_lido{
    color:#a0a7b4;
    background:rgba(255,255,255,.07);
}

.status.lendo{
    color:#ff8b69;
    background:rgba(255,90,54,.13);
}

.status.lido{
    color:var(--green);
    background:rgba(64,217,138,.12);
}

.status.quero_ler{
    color:#8aa9ff;
    background:rgba(107,149,255,.13);
}

.page-control{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:9px;
}

.page-control input{
    width:68px;
    padding:6px 7px;
    color:#fff;
    outline:none;
    border:1px solid var(--border);
    border-radius:7px;
    background:#0f1218;
}

.page-control span{
    font-size:11px;
    color:var(--muted);
}

.edition-actions{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    flex-wrap:wrap;
    gap:6px;
}

.small-button{
    padding:7px 9px;
    color:#fff;
    border:1px solid var(--border);
    border-radius:8px;
    background:#202530;
}

.small-button:hover{background:#2b323f}

.small-button.read{
    border-color:transparent;
    background:var(--primary);
}

/* =========================
   TOAST
========================= */

.toast-container{
    position:fixed;
    right:22px;
    bottom:22px;
    z-index:300;
    display:flex;
    flex-direction:column;
    gap:9px;
}

.toast{
    min-width:270px;
    max-width:380px;
    padding:13px 16px;
    color:#fff;
    border:1px solid var(--border);
    border-radius:11px;
    background:#202530;
    box-shadow:0 15px 35px rgba(0,0,0,.35);
}

/* =========================
   RESPONSIVO
========================= */

@media(max-width:1000px){
    .sidebar{
        transform:translateX(-100%);
        transition:.24s;
    }

    .sidebar.open{transform:translateX(0)}
    .main{margin-left:0}
    .mobile-menu{display:block}

    .stats{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:650px){
    .header{padding:12px}

    .content{
        padding:23px 13px 60px;
    }

    .header-actions span{display:none}

    .action-button{padding:11px 12px}

    .library-grid,
    .subcollection-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:18px 12px;
    }

    .stats{gap:9px}

    .stat-card{
        min-height:105px;
        padding:15px;
    }

    .stat-number{font-size:25px}

    .toolbar-right{
        width:100%;
        margin-left:0;
    }

    .sort-select{width:100%}

    .modal{padding:7px}

    .modal-header{padding:16px}

    .modal-body{padding:13px}

    .edition{
        align-items:flex-start;
    }

    .edition-actions{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<aside id="sidebar" class="sidebar">

    <div class="logo">
        <div class="logo-icon">📚</div>
        <div>
            Minha<br>
            <span>Estante</span>
        </div>
    </div>

    <div class="menu-label">BIBLIOTECA</div>

    <button id="menuTodos" class="menu-item active" onclick="selecionarFiltro('todos')">
        <span class="menu-icon">🏠</span>
        Todos
    </button>

    <button id="menuLendo" class="menu-item" onclick="selecionarFiltro('lendo')">
        <span class="menu-icon">📖</span>
        Lendo
    </button>

    <button id="menuQuero" class="menu-item" onclick="selecionarFiltro('quero_ler')">
        <span class="menu-icon">🔖</span>
        Quero ler
    </button>

    <button id="menuLidos" class="menu-item" onclick="selecionarFiltro('lido')">
        <span class="menu-icon">✅</span>
        Lidos
    </button>

    <button id="menuFavoritos" class="menu-item" onclick="selecionarFiltro('favoritos')">
        <span class="menu-icon">⭐</span>
        Favoritos
    </button>

    <div class="menu-label">CATEGORIA</div>

    <button id="menuGibis" class="menu-item active" onclick="mudarCategoria('gibis')">
        <span class="menu-icon">🦸</span>
        Gibis / HQs
    </button>

    <button id="menuMangas" class="menu-item" onclick="mudarCategoria('mangas')">
        <span class="menu-icon">🇯🇵</span>
        Mangás
    </button>

</aside>


<main class="main">

<header class="header">

    <button class="mobile-menu" onclick="alternarMenu()">☰</button>

    <div class="search-box">
        <span class="search-icon">🔎</span>

        <input
            id="pesquisa"
            type="search"
            placeholder="Pesquisar coleção, subcoleção ou arquivo..."
        >
    </div>

    <div class="header-actions">

        <button class="action-button" onclick="recarregarBiblioteca()">
            ↻
            <span>Atualizar</span>
        </button>

        <button class="action-button primary" onclick="sincronizarDrive()">
            🔄
            <span>Sincronizar Drive</span>
        </button>

    </div>

</header>


<div class="content">

    <section class="page-heading">

        <h1 id="tituloPagina">Gibis / HQs</h1>

        <p>
            Sua biblioteca organizada por pastas, editoras, séries, sagas e subcoleções.
        </p>

    </section>


    <section class="stats">

        <div class="stat-card">

            <div class="stat-label">Coleções principais</div>

            <div id="statColecoes" class="stat-number">
                0
            </div>

            <div id="statColecoesDetalhe" class="stat-detail">
                0 subcoleções
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">Arquivos</div>

            <div id="statArquivos" class="stat-number">
                0
            </div>

            <div class="stat-detail">
                volumes e edições
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">Lidos</div>

            <div id="statLidos" class="stat-number">
                0
            </div>

            <div class="stat-detail">
                concluídos
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">Lendo</div>

            <div id="statLendo" class="stat-number">
                0
            </div>

            <div class="stat-detail">
                em andamento
            </div>

        </div>

    </section>


    <div class="toolbar">

        <button class="chip active" data-filter="todos" onclick="selecionarFiltro('todos')">
            Todos
        </button>

        <button class="chip" data-filter="lendo" onclick="selecionarFiltro('lendo')">
            📖 Lendo
        </button>

        <button class="chip" data-filter="quero_ler" onclick="selecionarFiltro('quero_ler')">
            🔖 Quero ler
        </button>

        <button class="chip" data-filter="lido" onclick="selecionarFiltro('lido')">

        </button>

        <button class="chip" data-filter="favoritos" onclick="selecionarFiltro('favoritos')">
            ⭐ Favoritos
        </button>


        <div class="toolbar-right">

            <select id="ordenacao" class="sort-select" onchange="renderizarBiblioteca()">

                <option value="nome">
                    Nome
                </option>

                <option value="quantidade">
                    Mais edições
                </option>

                <option value="recente">
                    Última leitura
                </option>

            </select>

        </div>

    </div>


    <div id="libraryGrid" class="library-grid">

        <div class="state">
            <div class="loader"></div>
            Carregando biblioteca...
        </div>

    </div>

</div>

</main>


<!-- MODAL -->

<div id="modal" class="modal">

    <div class="modal-box">

        <div class="modal-header">

            <button id="modalBack" class="modal-back" onclick="voltarColecao()">
                ←
            </button>

            <div class="modal-title-container">

                <div id="breadcrumb" class="breadcrumb"></div>

                <h2 id="modalTitle" class="modal-title">
                    Coleção
                </h2>

                <div id="modalSubtitle" class="modal-subtitle"></div>

            </div>

            <button class="close-button" onclick="fecharModal()">
                ×
            </button>

        </div>

        <div id="modalBody" class="modal-body"></div>

    </div>

</div>


<div id="toastContainer" class="toast-container"></div>


<script>

let filtroAtual = "todos";

let biblioteca = [];

let progresso = {};

let mapaColecoes = new Map();

let capasPastas = {};

let colecaoAtual = null;

let historicoColecoes = [];


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    async function(){

        document
            .getElementById("pesquisa")
            .addEventListener(
                "input",
                renderizarBiblioteca
            );

        await carregarTudo();
    }
);


/* =========================================================
   CARREGAMENTO
========================================================= */

async function carregarTudo(){

    mostrarCarregando();

    try{

        await Promise.all([
            carregarBiblioteca(),
            carregarProgresso(),
            carregarCapasPastas()
        ]);

        montarArvoreColecoes();

        atualizarEstatisticas();

        renderizarBiblioteca();

    }catch(erro){

        console.error(erro);

        mostrarErro(
            erro.message
        );
    }
}


/* =========================================================
   SUPABASE - BIBLIOTECA
========================================================= */

async function carregarBiblioteca(){

    biblioteca = [];

    const limite = 1000;

    let offset = 0;

    while(true){

        const url =
            SUPABASE_URL +
            "/rest/v1/biblioteca" +
            "?select=*" +
            "&categoria=eq." +
            encodeURIComponent(categoriaAtual) +
            "&encontrado_no_drive=eq.true" +
            "&order=nivel.asc,pasta_nome.asc,nome.asc" +
            "&limit=" +
            limite +
            "&offset=" +
            offset;


        const resposta =
            await fetch(
                url,
                {
                    headers:{
                        apikey:
                            SUPABASE_PUBLISHABLE_KEY
                    }
                }
            );


        if(!resposta.ok){

            const texto =
                await resposta.text();

            throw new Error(
                "Supabase HTTP " +
                resposta.status +
                ": " +
                texto
            );
        }


        const dados =
            await resposta.json();


        if(
            !dados ||
            dados.length === 0
        ){
            break;
        }


        biblioteca.push(
            ...dados
        );


        if(
            dados.length <
            limite
        ){
            break;
        }


        offset += limite;
    }
}


/* =========================================================
   SUPABASE - PROGRESSO
========================================================= */

async function carregarProgresso(){

    progresso = {};

    const resposta =
        await fetch(
            SUPABASE_URL +
            "/rest/v1/progresso?select=*",
            {
                headers:{
                    apikey:
                        SUPABASE_PUBLISHABLE_KEY
                }
            }
        );


    if(!resposta.ok){

        console.warn(
            await resposta.text()
        );

        return;
    }


    const dados =
        await resposta.json();


    dados.forEach(
        function(item){

            progresso[
                item.file_id
            ] = item;
        }
    );
}


/* =========================================================
   SUPABASE - CAPAS PERSONALIZADAS DAS PASTAS
========================================================= */

async function carregarCapasPastas(){

    capasPastas = {};

    const url =
        SUPABASE_URL +
        "/rest/v1/capas_pastas" +
        "?select=pasta_id,capa_url" +
        "&categoria=eq." +
        encodeURIComponent(categoriaAtual);

    const resposta =
        await fetch(
            url,
            {
                headers:{
                    apikey:
                        SUPABASE_PUBLISHABLE_KEY
                }
            }
        );

    if(!resposta.ok){

        console.warn(
            "Não foi possível carregar capas_pastas:",
            await resposta.text()
        );

        return;
    }

    const dados =
        await resposta.json();

    dados.forEach(
        function(item){

            if(
                item.pasta_id &&
                item.capa_url
            ){
                capasPastas[item.pasta_id] =
                    item.capa_url;
            }
        }
    );
}


/* =========================================================
   CRIAR ÁRVORE DE COLEÇÕES
   Agora usa caminho_pastas para reconstruir TODOS os níveis,
   inclusive pastas intermediárias sem arquivos diretos.
========================================================= */

function montarArvoreColecoes(){

    mapaColecoes = new Map();

    function garantirColecao(dados){

        if(!dados || !dados.id){
            return null;
        }

        if(!mapaColecoes.has(dados.id)){

            mapaColecoes.set(
                dados.id,
                {
                    id: dados.id,
                    nome: dados.nome || "Sem nome",
                    parentId: dados.parentId || null,
                    parentName: dados.parentName || null,
                    nivel: Number(dados.nivel || 0),
                    itens: [],
                    filhos: [],
                    capa: null
                }
            );
        }
        else{

            const existente = mapaColecoes.get(dados.id);

            if(
                !existente.parentId &&
                dados.parentId
            ){
                existente.parentId = dados.parentId;
            }

            if(
                !existente.parentName &&
                dados.parentName
            ){
                existente.parentName = dados.parentName;
            }

            if(
                (!existente.nome || existente.nome === "Sem nome") &&
                dados.nome
            ){
                existente.nome = dados.nome;
            }

            existente.nivel = Number(dados.nivel ?? existente.nivel ?? 0);
        }

        return mapaColecoes.get(dados.id);
    }


    biblioteca.forEach(
        function(item){

            let caminho = item.caminho_pastas;

            /*
             * O Supabase normalmente devolve jsonb já como array.
             * Este trecho também aceita uma string JSON, por segurança.
             */
            if(typeof caminho === "string"){

                try{
                    caminho = JSON.parse(caminho);
                }
                catch(erro){
                    caminho = null;
                }
            }


            /*
             * Caminho novo:
             *
             * Gibis
             *   > Marvel
             *     > Sagas
             *       > Guerra Civil
             *
             * Todos esses níveis são criados, mesmo quando uma pasta
             * intermediária não possui nenhum quadrinho diretamente.
             */
            if(
                Array.isArray(caminho) &&
                caminho.length > 0
            ){

                caminho.forEach(
                    function(pasta, indice){

                        if(
                            !pasta ||
                            !pasta.id
                        ){
                            return;
                        }

                        const pai =
                            indice > 0
                                ? caminho[indice - 1]
                                : null;

                        garantirColecao(
                            {
                                id: pasta.id,
                                nome: pasta.nome || "Sem nome",
                                parentId: pai?.id || null,
                                parentName: pai?.nome || null,
                                nivel: indice
                            }
                        );
                    }
                );


                const pastaAtual =
                    caminho[caminho.length - 1];

                const colecaoAtual =
                    pastaAtual?.id
                        ? mapaColecoes.get(pastaAtual.id)
                        : null;

                if(colecaoAtual){

                    colecaoAtual.itens.push(item);

                    if(
                        !colecaoAtual.capa &&
                        item.capa_url
                    ){
                        colecaoAtual.capa = item.capa_url;
                    }
                }

                return;
            }


            /*
             * Compatibilidade com registros antigos que ainda não
             * possuam caminho_pastas.
             */
            const colecao =
                garantirColecao(
                    {
                        id: item.pasta_id,
                        nome: item.pasta_nome || "Sem nome",
                        parentId: item.pasta_pai_id || null,
                        parentName: item.pasta_pai_nome || null,
                        nivel: Number(item.nivel || 0)
                    }
                );

            if(colecao){

                colecao.itens.push(item);

                if(
                    !colecao.capa &&
                    item.capa_url
                ){
                    colecao.capa = item.capa_url;
                }
            }


            if(item.pasta_pai_id){

                garantirColecao(
                    {
                        id: item.pasta_pai_id,
                        nome: item.pasta_pai_nome || "Coleção",
                        parentId: null,
                        parentName: null,
                        nivel: Math.max(
                            0,
                            Number(item.nivel || 1) - 1
                        )
                    }
                );
            }
        }
    );


    /*
     * Liga cada pasta ao pai.
     * Como os nós já foram todos criados pelo caminho_pastas,
     * não perdemos mais pastas intermediárias.
     */
    mapaColecoes.forEach(
        function(colecao){

            colecao.filhos = [];
        }
    );


    mapaColecoes.forEach(
        function(colecao){

            if(
                colecao.parentId &&
                mapaColecoes.has(colecao.parentId)
            ){

                const pai =
                    mapaColecoes.get(colecao.parentId);

                if(
                    !pai.filhos.some(
                        filho => filho.id === colecao.id
                    )
                ){
                    pai.filhos.push(colecao);
                }
            }
        }
    );


    /*
     * Ordenação natural: 2 antes de 10, nomes com acentos etc.
     */
    mapaColecoes.forEach(
        function(colecao){

            colecao.filhos.sort(
                function(a,b){

                    return a.nome.localeCompare(
                        b.nome,
                        "pt-BR",
                        {
                            numeric:true,
                            sensitivity:"base"
                        }
                    );
                }
            );
        }
    );


    /*
     * CAPAS PERSONALIZADAS
     *
     * Têm prioridade sobre qualquer capa herdada de quadrinho.
     */
    mapaColecoes.forEach(
        function(colecao){

            if(
                capasPastas[colecao.id]
            ){
                colecao.capa =
                    capasPastas[colecao.id];

                colecao.capaPersonalizada =
                    true;
            }
        }
    );


    /*
     * Pasta sem capa própria herda uma capa de algum descendente.
     * Isso permite que Marvel, DC, Sagas etc. também tenham capa.
     */
    const porNivel =
        Array.from(mapaColecoes.values())
            .sort(
                (a,b) => b.nivel - a.nivel
            );

    porNivel.forEach(
        function(colecao){

            if(!colecao.capa){

                colecao.capa =
                    encontrarCapaDescendente(
                        colecao
                    );
            }
        }
    );
}

/* =========================================================
   CAPA DESCENDENTE
========================================================= */

function encontrarCapaDescendente(
    colecao,
    visitados = new Set()
){

    if(
        !colecao ||
        visitados.has(
            colecao.id
        )
    ){
        return null;
    }


    visitados.add(
        colecao.id
    );


    if(colecao.capa){
        return colecao.capa;
    }


    for(
        const filho of colecao.filhos
    ){

        const capa =
            encontrarCapaDescendente(
                filho,
                visitados
            );


        if(capa){
            return capa;
        }
    }


    return null;
}


/* =========================================================
   COLEÇÕES PRINCIPAIS

   caminho_pastas usa:
   nível 0 = raiz (Gibis / Mangás)
   nível 1 = primeira pasta abaixo da raiz

   Exemplo:
   Gibis > Marvel > Sagas > Guerra Civil
           ^ nível 1
========================================================= */

function obterColecoesPrincipais(){

    const todas =
        Array.from(
            mapaColecoes.values()
        );


    /*
     * Primeiro tentamos localizar a raiz real da categoria.
     */
    const raizes =
        todas.filter(
            c =>
                c.parentId === null &&
                c.nivel === 0
        );


    /*
     * Se a raiz foi reconstruída pelo caminho_pastas,
     * mostramos somente os filhos dela.
     *
     * Assim a tela principal passa a mostrar:
     * Marvel, DC, Vertigo, Image, Crossovers...
     * e, em Mangás, as pastas principais abaixo de Mangás.
     */
    if(raizes.length > 0){

        const idsRaiz =
            new Set(
                raizes.map(
                    r => r.id
                )
            );

        const principais =
            todas.filter(
                c =>
                    c.parentId &&
                    idsRaiz.has(c.parentId)
            );

        if(principais.length > 0){
            return principais;
        }
    }


    /*
     * Fallback para dados antigos.
     */
    let principais =
        todas.filter(
            c =>
                c.nivel === 1
        );


    if(principais.length === 0){

        const candidatas =
            todas.filter(
                c =>
                    c.itens.length > 0 ||
                    c.filhos.length > 0
            );

        if(candidatas.length === 0){
            return [];
        }

        const menorNivel =
            Math.min(
                ...candidatas.map(
                    c => c.nivel
                )
            );


        principais =
            candidatas.filter(
                c =>
                    c.nivel === menorNivel
            );
    }


    return principais;
}

/* =========================================================
   TODOS OS ARQUIVOS DE UMA ÁRVORE
========================================================= */

function obterItensRecursivos(
    colecao,
    visitados = new Set()
){

    if(
        !colecao ||
        visitados.has(
            colecao.id
        )
    ){
        return [];
    }


    visitados.add(
        colecao.id
    );


    let itens =
        [
            ...colecao.itens
        ];


    colecao.filhos.forEach(
        function(filho){

            itens.push(
                ...obterItensRecursivos(
                    filho,
                    visitados
                )
            );
        }
    );


    return itens;
}


/* =========================================================
   QUANTIDADE DE SUBCOLEÇÕES
========================================================= */

function contarDescendentes(
    colecao,
    visitados = new Set()
){

    if(
        !colecao ||
        visitados.has(
            colecao.id
        )
    ){
        return 0;
    }


    visitados.add(
        colecao.id
    );


    let total =
        colecao.filhos.length;


    colecao.filhos.forEach(
        function(filho){

            total +=
                contarDescendentes(
                    filho,
                    visitados
                );
        }
    );


    return total;
}


/* =========================================================
   FILTROS
========================================================= */

function itemPassaFiltro(
    item
){

    if(
        filtroAtual ===
        "todos"
    ){
        return true;
    }


    const p =
        progresso[
            item.file_id
        ];


    if(!p){
        return false;
    }


    if(
        filtroAtual ===
        "favoritos"
    ){

        return (
            p.favorito ===
            true
        );
    }


    return (
        p.status ===
        filtroAtual
    );
}


function colecaoPassaFiltro(
    colecao
){

    if(
        filtroAtual ===
        "todos"
    ){
        return true;
    }


    return obterItensRecursivos(
        colecao
    ).some(
        itemPassaFiltro
    );
}


/* =========================================================
   BUSCA RECURSIVA
========================================================= */

function colecaoCombinaBusca(
    colecao,
    busca
){

    if(!busca){
        return true;
    }


    if(
        colecao.nome
            .toLowerCase()
            .includes(
                busca
            )
    ){
        return true;
    }


    if(
        colecao.itens.some(
            item =>
                String(
                    item.nome || ""
                )
                .toLowerCase()
                .includes(
                    busca
                )
        )
    ){
        return true;
    }


    return colecao.filhos.some(
        filho =>
            colecaoCombinaBusca(
                filho,
                busca
            )
    );
}


/* =========================================================
   RENDER DA ESTANTE
========================================================= */

function renderizarBiblioteca(){

    const grid =
        document.getElementById(
            "libraryGrid"
        );


    const busca =
        document
            .getElementById(
                "pesquisa"
            )
            .value
            .trim()
            .toLowerCase();


    let colecoes =
        obterColecoesPrincipais();


    colecoes =
        colecoes.filter(
            function(colecao){

                return (
                    colecaoPassaFiltro(
                        colecao
                    ) &&
                    colecaoCombinaBusca(
                        colecao,
                        busca
                    )
                );
            }
        );


    ordenarColecoes(
        colecoes
    );


    if(
        colecoes.length === 0
    ){

        grid.innerHTML =
            `
            <div class="state">

                <div class="state-icon">
                    📭
                </div>

                Nenhuma coleção encontrada.

            </div>
            `;

        return;
    }


    grid.innerHTML =
        "";


    colecoes.forEach(
        function(colecao){

            grid.appendChild(
                criarCardColecao(
                    colecao
                )
            );
        }
    );
}


/* =========================================================
   CARD DE COLEÇÃO
========================================================= */

function criarCardColecao(
    colecao
){

    const card =
        document.createElement(
            "article"
        );


    card.className =
        "collection-card";


    const itens =
        obterItensRecursivos(
            colecao
        );


    const total =
        itens.length;


    const lidos =
        itens.filter(
            item =>
                progresso[
                    item.file_id
                ]?.status ===
                "lido"
        ).length;


    const favoritos =
        itens.filter(
            item =>
                progresso[
                    item.file_id
                ]?.favorito ===
                true
        ).length;


    const subcolecoes =
        contarDescendentes(
            colecao
        );


    const percentual =
        total > 0
            ? Math.round(
                (
                    lidos /
                    total
                ) * 100
            )
            : 0;


    const capaHtml =
        gerarCapaHtml(
            colecao
        );


    card.innerHTML =
        `
        <div class="cover">

            ${capaHtml}

            <div class="cover-count">
                ${total} ed.
            </div>

            ${
                subcolecoes > 0
                    ? `
                    <div class="cover-sub">
                        📁 ${subcolecoes}
                    </div>
                    `
                    : ""
            }

            ${
                favoritos > 0
                    ? `
                    <div class="cover-star">
                        ⭐
                    </div>
                    `
                    : ""
            }

        </div>


        <div class="collection-info">

            <div
                class="collection-title"
                title="${escapeHtml(
                    colecao.nome
                )}"
            >
                ${escapeHtml(
                    colecao.nome
                )}
            </div>


            <div class="collection-meta">

                ${lidos}
                de
                ${total}
                lidos

                ${
                    subcolecoes > 0
                        ? ` • ${subcolecoes} subcoleção(ões)`
                        : ""
                }

            </div>


            <div class="progress-bar">

                <div
                    class="progress-fill"
                    style="width:${percentual}%"
                ></div>

            </div>

        </div>
        `;


    card.onclick =
        function(){

            abrirColecao(
                colecao
            );
        };


    return card;
}


/* =========================================================
   CAPA HTML
========================================================= */

function gerarCapaHtml(
    colecao
){

    if(
        colecao.capa
    ){

        return `
            <img
                src="${escapeHtml(
                    colecao.capa
                )}"
                loading="lazy"
                alt="Capa"
                onerror="
                    this.style.display='none';
                    this.nextElementSibling.style.display='flex';
                "
            >

            <div
                class="cover-placeholder"
                style="display:none"
            >

                <div class="placeholder-icon">
                    📚
                </div>

                <div class="placeholder-name">
                    ${escapeHtml(
                        colecao.nome
                    )}
                </div>

            </div>
        `;
    }


    return `
        <div class="cover-placeholder">

            <div class="placeholder-icon">
                📚
            </div>

            <div class="placeholder-name">
                ${escapeHtml(
                    colecao.nome
                )}
            </div>

        </div>
    `;
}


/* =========================================================
   ABRIR COLEÇÃO
========================================================= */

function abrirColecao(
    colecao,
    adicionarHistorico = true
){

    if(
        adicionarHistorico &&
        colecaoAtual
    ){

        historicoColecoes.push(
            colecaoAtual
        );
    }


    colecaoAtual =
        colecao;


    atualizarModalColecao();


    document
        .getElementById(
            "modal"
        )
        .classList
        .add(
            "open"
        );


    document.body.style.overflow =
        "hidden";
}


/* =========================================================
   ATUALIZAR MODAL
========================================================= */

function atualizarModalColecao(){

    if(!colecaoAtual){
        return;
    }


    const colecao =
        colecaoAtual;


    const todosItens =
        obterItensRecursivos(
            colecao
        );


    document
        .getElementById(
            "modalTitle"
        )
        .textContent =
            colecao.nome;


    document
        .getElementById(
            "modalSubtitle"
        )
        .textContent =
            colecao.itens.length +
            " arquivo(s) nesta pasta • " +
            todosItens.length +
            " no total";


    /*
     * Botão voltar.
     */

    document
        .getElementById(
            "modalBack"
        )
        .classList
        .toggle(
            "show",
            historicoColecoes.length > 0
        );


    /*
     * Breadcrumb.
     */

    const nomes =
        historicoColecoes
            .map(
                item =>
                    item.nome
            )
            .concat(
                colecao.nome
            );


    document
        .getElementById(
            "breadcrumb"
        )
        .textContent =
            nomes.join(
                "  ›  "
            );


    renderizarConteudoColecao();
}


/* =========================================================
   CONTEÚDO DA COLEÇÃO
========================================================= */

function renderizarConteudoColecao(){

    const body =
        document.getElementById(
            "modalBody"
        );


    body.innerHTML =
        "";


    /*
     * SUBCOLEÇÕES
     */

    if(
        colecaoAtual.filhos.length > 0
    ){

        const secao =
            document.createElement(
                "section"
            );


        secao.className =
            "modal-section";


        secao.innerHTML =
            `
            <div class="section-title-row">

                <h3 class="section-title">
                    📁 Subcoleções
                </h3>

                <span class="section-count">
                    ${colecaoAtual.filhos.length}
                </span>

            </div>

            <div class="subcollection-grid"></div>
            `;


        const grid =
            secao.querySelector(
                ".subcollection-grid"
            );


        colecaoAtual.filhos.forEach(
            function(filho){

                grid.appendChild(
                    criarCardColecao(
                        filho
                    )
                );
            }
        );


        body.appendChild(
            secao
        );
    }


    /*
     * ARQUIVOS DIRETOS
     */

    const secaoArquivos =
        document.createElement(
            "section"
        );


    secaoArquivos.className =
        "modal-section";


    secaoArquivos.innerHTML =
        `
        <div class="section-title-row">

            <h3 class="section-title">
                📚 Arquivos desta coleção
            </h3>

            <span class="section-count">
                ${colecaoAtual.itens.length}
            </span>

        </div>

        <div class="lista-arquivos"></div>
        `;


    const lista =
        secaoArquivos.querySelector(
            ".lista-arquivos"
        );


    const itens =
        [
            ...colecaoAtual.itens
        ];


    itens.sort(
        function(a,b){

            return String(
                a.nome || ""
            )
            .localeCompare(
                String(
                    b.nome || ""
                ),
                "pt-BR",
                {
                    numeric:true,
                    sensitivity:"base"
                }
            );
        }
    );


    if(
        itens.length === 0
    ){

        lista.innerHTML =
            `
            <div class="empty-inline">

                Esta pasta não possui arquivos diretos.

                <br>

                Os quadrinhos estão organizados nas subcoleções acima.

            </div>
            `;
    }
    else{

        itens.forEach(
            function(item){

                lista.appendChild(
                    criarEdicao(
                        item
                    )
                );
            }
        );
    }


    body.appendChild(
        secaoArquivos
    );
}


/* =========================================================
   VOLTAR NA ÁRVORE
========================================================= */

function voltarColecao(){

/* =========================================================
   SALVAR PROGRESSO
========================================================= */

async function salvarProgresso(
    fileId,
    alteracoes
){

    const existente =
        progresso[
            fileId
        ] || {};


    const registro = {

        file_id:
            fileId,

        status:
            alteracoes.status ??
            existente.status ??
            "nao_lido",

        pagina_atual:
            alteracoes.pagina_atual ??
            existente.pagina_atual ??
            0,

        total_paginas:
            alteracoes.total_paginas ??
            existente.total_paginas ??
            0,

        favorito:
            alteracoes.favorito ??
            existente.favorito ??
            false,

        capa_url:
            existente.capa_url ??
            null,

        ultima_leitura:
            new Date()
                .toISOString()
    };


    const resposta =
        await fetch(
            SUPABASE_URL +
            "/rest/v1/progresso",
            {
                method:"POST",

                headers:{
                    apikey:
                        SUPABASE_PUBLISHABLE_KEY,

                    "Content-Type":
                        "application/json",

                    Prefer:
                        "resolution=merge-duplicates,return=minimal"
                },

                body:
                    JSON.stringify(
                        registro
                    )
            }
        );


    if(!resposta.ok){

        console.error(
            await resposta.text()
        );

        toast(
            "Erro ao salvar progresso."
        );

        return false;
    }


    progresso[
        fileId
    ] = registro;


    return true;
}


/* =========================================================
   STATUS
========================================================= */

async function alterarStatus(
    fileId,
    status
){

    const ok =
        await salvarProgresso(
            fileId,
            {
                status:
                    status
            }
        );


    if(!ok){
        return;
    }


    toast(
        "Marcado como " +
        nomeStatus(
            status
        )
    );


    atualizarEstatisticas();

    atualizarModalColecao();

    renderizarBiblioteca();
}


/* =========================================================
   FAVORITO
========================================================= */

async function alternarFavorito(
    fileId
){

    const atual =
        progresso[
            fileId
        ]?.favorito ===
        true;


    const ok =
        await salvarProgresso(
            fileId,
            {
                favorito:
                    !atual
            }
        );


    if(!ok){
        return;
    }


    toast(
        !atual
            ? "Adicionado aos favoritos ⭐"
            : "Removido dos favoritos"
    );


    atualizarModalColecao();

    renderizarBiblioteca();
}


/* =========================================================
   PÁGINAS
========================================================= */

async function salvarPaginas(
    fileId
){

    const pagina =
        Number(
            document
                .getElementById(
                    "pagina_" +
                    fileId
                )
                .value || 0
        );


    const total =
        Number(
            document
                .getElementById(
                    "total_" +
                    fileId
                )
                .value || 0
        );


    let status =
        progresso[
            fileId
        ]?.status ||
        "nao_lido";


    if(
        pagina > 0 &&
        status ===
        "nao_lido"
    ){

        status =
            "lendo";
    }


    if(
        total > 0 &&
        pagina >= total
    ){

        status =
            "lido";
    }


    const ok =
        await salvarProgresso(
            fileId,
            {
                pagina_atual:
                    pagina,

                total_paginas:
                    total,

                status:
                    status
            }
        );


    if(!ok){
        return;
    }


    toast(
        "Progresso salvo."
    );


    atualizarEstatisticas();

    atualizarModalColecao();

    renderizarBiblioteca();
}


/* =========================================================
   ESTATÍSTICAS
========================================================= */

function atualizarEstatisticas(){

    const principais =
        obterColecoesPrincipais();


    const todas =
        Array.from(
            mapaColecoes.values()
        )
        .filter(
            c =>
                c.nivel >= 1
        );


    const subcolecoes =
        Math.max(
            0,
            todas.length -
            principais.length
        );


    let lidos = 0;

    let lendo = 0;


    biblioteca.forEach(
        function(item){

            const status =
                progresso[
                    item.file_id
                ]?.status;


            if(
                status ===
                "lido"
            ){
                lidos++;
            }


            if(
                status ===
                "lendo"
            ){
                lendo++;
            }
        }
    );


    document
        .getElementById(
            "statColecoes"
        )
        .textContent =
            principais.length;


    document
        .getElementById(
            "statColecoesDetalhe"
        )
        .textContent =
            subcolecoes +
            " subcoleção(ões)";


    document
        .getElementById(
            "statArquivos"
        )
        .textContent =
            biblioteca.length;


    document
        .getElementById(
            "statLidos"
        )
        .textContent =
            lidos;


    document
        .getElementById(
            "statLendo"
        )
        .textContent =
            lendo;
}


/* =========================================================
   ORDENAÇÃO
========================================================= */

function ordenarColecoes(
    colecoes
){

    const tipo =
        document
            .getElementById(
                "ordenacao"
            )
            .value;


    if(
        tipo ===
        "quantidade"
    ){

        colecoes.sort(
            function(a,b){

                return (
                    obterItensRecursivos(
                        b
                    ).length -
                    obterItensRecursivos(
                        a
                    ).length
                );
            }
        );

        return;
    }


    if(
        tipo ===
        "recente"
    ){

        colecoes.sort(
            function(a,b){

                return (
                    obterUltimaLeitura(
                        b
                    ) -
                    obterUltimaLeitura(
                        a
                    )
                );
            }
        );

        return;
    }


    colecoes.sort(
        function(a,b){

            return a.nome.localeCompare(
                b.nome,
                "pt-BR",
                {
                    numeric:true,
                    sensitivity:"base"
                }
            );
        }
    );
}


/* =========================================================
   ÚLTIMA LEITURA
========================================================= */

function obterUltimaLeitura(
    colecao
){

    let maior = 0;


    obterItensRecursivos(
        colecao
    )
    .forEach(
        function(item){

            const data =
                progresso[
                    item.file_id
                ]?.ultima_leitura;


            if(!data){
                return;
            }


            const timestamp =
                new Date(
                    data
                ).getTime();


            if(
                timestamp >
                maior
            ){
                maior =
                    timestamp;
            }
        }
    );


    return maior;
}


/* =========================================================
   CATEGORIA
========================================================= */

async function mudarCategoria(
    categoria
){

    if(
        categoria ===
        categoriaAtual
    ){
        return;
    }


    fecharModal();


    categoriaAtual =
        categoria;


    filtroAtual =
        "todos";


    document
        .getElementById(
            "menuGibis"
        )
        .classList
        .toggle(
            "active",
            categoria ===
            "gibis"
        );


    document
        .getElementById(
            "menuMangas"
        )
        .classList
        .toggle(
            "active",
            categoria ===
            "mangas"
        );


    document
        .getElementById(
            "tituloPagina"
        )
        .textContent =
            categoria ===
            "gibis"
                ? "Gibis / HQs"
                : "Mangás";


    document
        .getElementById(
            "pesquisa"
        )
        .value =
            "";


    atualizarFiltroVisual();

    fecharMenuMobile();

    await carregarTudo();
}


/* =========================================================
   FILTRO
========================================================= */

function selecionarFiltro(
    filtro
){

    filtroAtual =
        filtro;


    atualizarFiltroVisual();

    renderizarBiblioteca();

    fecharMenuMobile();
}


function atualizarFiltroVisual(){

    document
        .querySelectorAll(
            ".chip"
        )
        .forEach(
            function(el){

                el.classList.toggle(
                    "active",
                    el.dataset.filter ===
                    filtroAtual
                );
            }
        );


    const mapa = {

        todos:
            "menuTodos",

        lendo:
            "menuLendo",

        quero_ler:
            "menuQuero",

        lido:
            "menuLidos",

        favoritos:
            "menuFavoritos"
    };


    [
        "menuTodos",
        "menuLendo",
        "menuQuero",
        "menuLidos",
        "menuFavoritos"
    ]
    .forEach(
        function(id){

            document
                .getElementById(
                    id
                )
                .classList
                .remove(
                    "active"
                );
        }
    );


    if(
        mapa[
            filtroAtual
        ]
    ){

        document
            .getElementById(
                mapa[
                    filtroAtual
                ]
            )
            .classList
            .add(
                "active"
            );
    }
}

        .classList

/* =========================================================
   HELPERS
========================================================= */

function nomeStatus(
    status
){

    const nomes = {

        nao_lido:
            "Não lido",

        lendo:
            "Lendo",

        lido:
            "Lido",

        quero_ler:
            "Quero ler"
    };


    return (
        nomes[
            status
        ] ||
        "Não lido"
    );
}


function iconeFormato(
    extensao
){

    extensao =
        String(
            extensao || ""
        )
        .toLowerCase();


    if(
        extensao ===
        "pdf"
    ){
        return "📕";
    }


    if(
        [
            "cbz",
            "cbr",
            "cb7",
            "zip",
            "rar",
            "7z"
        ]
        .includes(
            extensao
        )
    ){
        return "📖";
    }


    if(
        [
            "epub",
            "mobi",
            "azw",
            "azw3"
        ]
        .includes(
            extensao
        )
    ){
        return "📘";
    }


    return "📚";
}


function formatarTamanho(
    bytes
){

    bytes =
        Number(
            bytes || 0
        );


    if(
        bytes <= 0
    ){
        return "0 MB";
    }


    const mb =
        bytes /
        1024 /
        1024;


    if(
        mb < 1024
    ){

        return (
            mb.toFixed(1) +
            " MB"
        );
    }


    return (
        (
            mb /
            1024
        )
        .toFixed(2) +
        " GB"
    );
}


function escapeHtml(
    texto
){

    return String(
        texto ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function escapeJs(
    texto
){

    return String(
        texto ?? ""
    )
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");
}

/* =========================================================
   TOAST
========================================================= */

function toast(
    mensagem
){

    const container =
        document.getElementById(
            "toastContainer"
        );


    const el =
        document.createElement(
            "div"
        );


    el.className =
        "toast";


    el.textContent =
        mensagem;


    container.appendChild(
        el
    );


    setTimeout(
        function(){

            el.remove();
        },
        4000
    );
}
