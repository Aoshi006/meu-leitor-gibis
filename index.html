<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#090b10"
>

<title>Minha Estante</title>


<style>

/* =========================================================
   VARIÁVEIS
========================================================= */

:root {

    --bg: #090b10;
    --bg-soft: #0d1017;

    --sidebar: #0c0f15;

    --card: #141820;
    --card-hover: #181d27;

    --border: rgba(255,255,255,.075);

    --text: #f5f7fb;
    --muted: #9299a8;
    --muted2: #626a7a;

    --primary: #ff5a36;
    --primary-light: #ff7a4f;

    --green: #40d98a;
    --blue: #6b95ff;
    --yellow: #ffc857;

    --radius: 16px;
}


/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {

    margin: 0;

    min-height: 100vh;

    background:

        radial-gradient(
            circle at 100% 0,
            rgba(255,90,54,.07),
            transparent 28%
        ),

        radial-gradient(
            circle at 0 100%,
            rgba(91,140,255,.05),
            transparent 30%
        ),

        var(--bg);

    color: var(--text);

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}


button,
input,
select {

    font: inherit;
}


button {
    cursor: pointer;
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {

    width: 240px;

    position: fixed;

    top: 0;
    bottom: 0;
    left: 0;

    padding: 27px 18px;

    background:
        rgba(12,15,21,.96);

    border-right:
        1px solid var(--border);

    z-index: 50;

    overflow-y: auto;

    backdrop-filter:
        blur(18px);
}


.logo {

    display: flex;

    align-items: center;

    gap: 12px;

    padding: 0 7px;

    margin-bottom: 34px;

    font-weight: 850;

    font-size: 22px;
}


.logo-icon {

    width: 42px;
    height: 42px;

    flex-shrink: 0;

    display: grid;

    place-items: center;

    border-radius: 13px;

    font-size: 21px;

    background:

        linear-gradient(
            135deg,
            var(--primary),
            var(--primary-light)
        );

    box-shadow:
        0 10px 28px
        rgba(255,90,54,.20);
}


.logo-text span {
    color: var(--primary);
}


.menu-label {

    margin:
        25px 11px
        9px;

    font-size: 10px;

    font-weight: 850;

    letter-spacing: 1.5px;

    color: #606879;
}


.menu-item {

    width: 100%;

    margin-bottom: 4px;

    padding: 12px 13px;

    display: flex;

    align-items: center;

    gap: 12px;

    border: 0;

    border-radius: 11px;

    color: var(--muted);

    background: transparent;

    text-align: left;

    transition: .18s;
}


.menu-item:hover {

    color: white;

    background:
        rgba(255,255,255,.04);
}


.menu-item.active {

    color: white;

    background:

        linear-gradient(
            90deg,
            rgba(255,90,54,.16),
            rgba(255,90,54,.04)
        );
}


.menu-icon {

    width: 23px;

    text-align: center;

    font-size: 17px;
}


/* =========================================================
   MAIN
========================================================= */

.main {

    margin-left: 240px;

    min-height: 100vh;
}


/* =========================================================
   HEADER
========================================================= */

.header {

    position: sticky;

    top: 0;

    z-index: 30;

    min-height: 78px;

    padding: 16px 30px;

    display: flex;

    align-items: center;

    gap: 15px;

    background:
        rgba(9,11,16,.86);

    border-bottom:
        1px solid var(--border);

    backdrop-filter:
        blur(20px);
}


.mobile-menu {

    display: none;

    width: 43px;
    height: 43px;

    border: 1px solid var(--border);

    border-radius: 11px;

    background: var(--card);

    color: white;
}


.search-box {

    width: 100%;

    max-width: 500px;

    position: relative;
}


.search-icon {

    position: absolute;

    top: 50%;
    left: 16px;

    transform:
        translateY(-50%);

    opacity: .55;
}


.search-box input {

    width: 100%;

    padding:
        13px 15px
        13px 45px;

    border:
        1px solid var(--border);

    border-radius: 13px;

    background: #141821;

    color: white;

    outline: none;

    transition: .18s;
}


.search-box input:focus {

    border-color:
        rgba(255,90,54,.45);

    box-shadow:
        0 0 0 3px
        rgba(255,90,54,.06);
}


.header-actions {

    margin-left: auto;

    display: flex;

    gap: 9px;
}


.action-button {

    padding:
        11px 15px;

    display: flex;

    align-items: center;

    gap: 7px;

    white-space: nowrap;

    border:
        1px solid var(--border);

    border-radius: 11px;

    background:
        #171b24;

    color: white;

    font-weight: 700;

    transition: .18s;
}


.action-button:hover {

    background:
        #202631;
}


.action-button.primary {

    border-color: transparent;

    background:

        linear-gradient(
            135deg,
            var(--primary),
            var(--primary-light)
        );
}


.action-button.primary:hover {

    transform:
        translateY(-1px);
}


/* =========================================================
   CONTEÚDO
========================================================= */

.content {

    max-width: 1600px;

    margin: auto;

    padding:
        34px 34px
        70px;
}


.page-heading {

    margin-bottom: 28px;
}


.page-heading h1 {

    margin: 0 0 7px;

    font-size:
        clamp(
            27px,
            3vw,
            39px
        );

    letter-spacing: -.7px;
}


.page-heading p {

    margin: 0;

    color: var(--muted);
}


/* =========================================================
   ESTATÍSTICAS
========================================================= */

.stats {

    display: grid;

    grid-template-columns:
        repeat(
            4,
            minmax(150px,1fr)
        );

    gap: 15px;

    margin-bottom: 28px;
}


.stat-card {

    min-height: 120px;

    padding: 20px;

    background:

        linear-gradient(
            145deg,
            rgba(255,255,255,.05),
            rgba(255,255,255,.017)
        );

    border:
        1px solid var(--border);

    border-radius: var(--radius);
}


.stat-label {

    margin-bottom: 8px;

    font-size: 13px;

    color: var(--muted);
}


.stat-number {

    font-size: 30px;

    font-weight: 900;
}


.stat-detail {

    margin-top: 5px;

    font-size: 11px;

    color: var(--muted2);
}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar {

    margin-bottom: 23px;

    display: flex;

    align-items: center;

    gap: 9px;

    flex-wrap: wrap;
}


.chip {

    padding:
        8px 14px;

    border:
        1px solid var(--border);

    border-radius: 100px;

    background:
        #131720;

    color: var(--muted);

    transition: .17s;
}


.chip:hover {
    color: white;
}


.chip.active {

    color: #ff8a68;

    background:
        rgba(255,90,54,.13);

    border-color:
        rgba(255,90,54,.35);
}


.toolbar-right {

    margin-left: auto;
}


.sort-select {

    padding:
        9px 12px;

    border:
        1px solid var(--border);

    border-radius: 10px;

    background:
        #131720;

    color: white;

    outline: none;
}


/* =========================================================
   GRID
========================================================= */

.library-grid {

    display: grid;

    grid-template-columns:

        repeat(
            auto-fill,
            minmax(175px,1fr)
        );

    gap:
        25px 20px;
}


/* =========================================================
   CARD COLEÇÃO
========================================================= */

.collection-card {

    min-width: 0;

    cursor: pointer;

    transition:
        transform .2s;
}


.collection-card:hover {

    transform:
        translateY(-6px);
}


.cover {

    position: relative;

    overflow: hidden;

    aspect-ratio:
        2 / 3;

    border:
        1px solid var(--border);

    border-radius: 16px;

    background:
        var(--card);

    box-shadow:
        0 12px 30px
        rgba(0,0,0,.27);
}


.collection-card:hover .cover {

    box-shadow:
        0 20px 45px
        rgba(0,0,0,.42);
}


.cover img {

    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;
}


.cover-placeholder {

    width: 100%;
    height: 100%;

    padding: 17px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    background:

        radial-gradient(
            circle at 30% 20%,
            rgba(255,90,54,.20),
            transparent 32%
        ),

        linear-gradient(
            145deg,
            #222835,
            #11141b
        );
}


.placeholder-icon {

    margin-bottom: 15px;

    font-size: 42px;
}


.placeholder-name {

    font-size: 13px;

    font-weight: 750;

    line-height: 1.4;

    color: #dde1e9;
}


.cover-count {

    position: absolute;

    top: 10px;
    left: 10px;

    padding:
        5px 8px;

    border-radius: 8px;

    font-size: 10px;

    font-weight: 850;

    background:
        rgba(0,0,0,.7);

    backdrop-filter:
        blur(8px);
}


.cover-star {

    position: absolute;

    top: 10px;
    right: 10px;

    width: 32px;
    height: 32px;

    display: grid;

    place-items: center;

    border-radius: 50%;

    background:
        rgba(0,0,0,.72);
}


.collection-info {

    padding:
        11px 3px 0;
}


.collection-title {

    margin-bottom: 5px;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

    font-size: 14px;

    font-weight: 750;
}


.collection-meta {

    color: var(--muted);

    font-size: 11px;
}


/* =========================================================
   PROGRESSO
========================================================= */

.progress-bar {

    width: 100%;
    height: 5px;

    margin-top: 9px;

    overflow: hidden;

    border-radius: 100px;

    background:
        #272c37;
}


.progress-fill {

    height: 100%;

    background:

        linear-gradient(
            90deg,
            var(--primary),
            var(--primary-light)
        );

    border-radius: inherit;
}


/* =========================================================
   ESTADOS
========================================================= */

.state {

    grid-column:
        1 / -1;

    padding:
        90px 20px;

    text-align: center;

    color: var(--muted);
}


.state-icon {

    margin-bottom: 14px;

    font-size: 48px;
}


.loader {

    width: 39px;
    height: 39px;

    margin:
        0 auto 16px;

    border:
        3px solid
        rgba(255,255,255,.08);

    border-top-color:
        var(--primary);

    border-radius: 50%;

    animation:
        spin .75s
        linear infinite;
}


@keyframes spin {

    to {
        transform:
            rotate(360deg);
    }
}


/* =========================================================
   MODAL
========================================================= */

.modal {

    display: none;

    position: fixed;

    inset: 0;

    z-index: 100;

    padding: 22px;

    overflow-y: auto;

    background:
        rgba(3,5,9,.88);

    backdrop-filter:
        blur(10px);
}


.modal.open {

    display: flex;

    justify-content: center;

    align-items: flex-start;
}


.modal-box {

    width: 100%;

    max-width: 1000px;

    margin: auto;

    overflow: hidden;

    border:
        1px solid var(--border);

    border-radius: 20px;

    background:
        #11151d;

    box-shadow:
        0 30px 90px
        rgba(0,0,0,.55);
}


.modal-header {

    padding:
        25px 28px;

    display: flex;

    align-items: center;

    gap: 15px;

    border-bottom:
        1px solid var(--border);
}


.modal-title-container {

    min-width: 0;

    flex: 1;
}


.modal-title {

    margin:
        0 0 5px;

    overflow: hidden;

    text-overflow: ellipsis;

    font-size: 25px;
}


.modal-subtitle {

    color: var(--muted);

    font-size: 12px;
}


.close-button {

    width: 42px;
    height: 42px;

    flex-shrink: 0;

    border:
        1px solid var(--border);

    border-radius: 11px;

    background:
        #1b202a;

    color: white;

    font-size: 21px;
}


.modal-body {

    padding:
        22px 27px;
}


/* =========================================================
   EDIÇÕES
========================================================= */

.edition {

    margin-bottom: 9px;

    padding: 15px;

    display: flex;

    align-items: center;

    gap: 14px;

    border:
        1px solid var(--border);

    border-radius: 14px;

    background:
        #161a22;
}


.edition:hover {

    background:
        #191e27;
}


.edition-icon {

    width: 44px;
    height: 55px;

    flex-shrink: 0;

    display: grid;

    place-items: center;

    border-radius: 9px;

    background:
        #252b37;

    font-size: 21px;
}


.edition-content {

    flex: 1;

    min-width: 0;
}


.edition-name {

    margin-bottom: 4px;

    overflow: hidden;

    text-overflow: ellipsis;

    font-size: 13px;

    font-weight: 750;
}


.edition-meta {

    font-size: 11px;

    color: var(--muted);
}


/* =========================================================
   STATUS
========================================================= */

.status {

    display: inline-block;

    margin-top: 7px;

    padding:
        4px 7px;

    border-radius: 100px;

    font-size: 9px;

    font-weight: 900;

    text-transform: uppercase;
}


.status.nao_lido {

    color: #a0a7b4;

    background:
        rgba(255,255,255,.07);
}


.status.lendo {

    color: #ff8b69;

    background:
        rgba(255,90,54,.13);
}


.status.lido {

    color: var(--green);

    background:
        rgba(64,217,138,.12);
}


.status.quero_ler {

    color: #8aa9ff;

    background:
        rgba(107,149,255,.13);
}


/* =========================================================
   CONTROLE DE PÁGINAS
========================================================= */

.page-control {

    margin-top: 9px;

    display: flex;

    align-items: center;

    gap: 6px;
}


.page-control input {

    width: 68px;

    padding:
        6px 7px;

    border:
        1px solid var(--border);

    border-radius: 7px;

    background:
        #0f1218;

    color: white;

    outline: none;
}


.page-control span {

    color: var(--muted);

    font-size: 11px;
}


/* =========================================================
   AÇÕES DA EDIÇÃO
========================================================= */

.edition-actions {

    display: flex;

    align-items: center;

    justify-content: flex-end;

    flex-wrap: wrap;

    gap: 6px;
}


.small-button {

    padding:
        7px 9px;

    border:
        1px solid var(--border);

    border-radius: 8px;

    background:
        #202530;

    color: white;

    transition: .15s;
}


.small-button:hover {

    background:
        #2b323f;
}


.small-button.read {

    border-color: transparent;

    background:
        var(--primary);
}


/* =========================================================
   TOAST
========================================================= */

.toast-container {

    position: fixed;

    z-index: 300;

    right: 22px;
    bottom: 22px;

    display: flex;

    flex-direction: column;

    gap: 9px;
}


.toast {

    max-width: 360px;

    min-width: 270px;

    padding:
        13px 16px;

    border:
        1px solid var(--border);

    border-radius: 11px;

    background:
        #202530;

    color: white;

    box-shadow:
        0 15px 35px
        rgba(0,0,0,.35);

    animation:
        toastIn .22s ease;
}


@keyframes toastIn {

    from {

        opacity: 0;

        transform:
            translateY(10px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}


/* =========================================================
   RESPONSIVIDADE
========================================================= */

@media (
    max-width: 1000px
) {

    .sidebar {

        transform:
            translateX(-100%);

        transition:
            .24s;
    }


    .sidebar.open {

        transform:
            translateX(0);
    }


    .main {

        margin-left: 0;
    }


    .mobile-menu {

        display: block;
    }


    .stats {

        grid-template-columns:
            repeat(2,1fr);
    }
}


@media (
    max-width: 650px
) {

    .header {

        padding:
            12px;
    }


    .content {

        padding:
            23px 13px
            60px;
    }


    .header-actions span {

        display: none;
    }


    .action-button {

        padding:
            11px 12px;
    }


    .library-grid {

        grid-template-columns:
            repeat(
                2,
                minmax(0,1fr)
            );

        gap:
            18px 12px;
    }


    .stats {

        gap: 9px;
    }


    .stat-card {

        min-height: 105px;

        padding: 15px;
    }


    .stat-number {

        font-size: 25px;
    }


    .toolbar-right {

        width: 100%;

        margin-left: 0;
    }


    .sort-select {

        width: 100%;
    }


    .modal {

        padding: 7px;
    }


    .modal-header {

        padding:
            17px;
    }


    .modal-body {

        padding:
            13px;
    }


    .edition {

        align-items:
            flex-start;
    }


    .edition-actions {

        flex-direction: column;
    }
}

</style>

</head>


<body>


<!-- ======================================================
     SIDEBAR
======================================================= -->

<aside
    id="sidebar"
    class="sidebar"
>


<div class="logo">

    <div class="logo-icon">

    </div>

        <span>

    </div>

    </div>

    </div>

    </div>

    </div>

    <div class="stat-detail">

<!-- ======================================================

<script>

/* =========================================================

/*

const URL_API =

/*
 * ========================================================
 *
 * ALTERE ESTA LINHA
 *
 * Supabase → Connect → Project URL
 *
 * ========================================================
 */

const SUPABASE_URL =
    "https://cnujjmfurumklnusiedh.supabase.co";


/*
 * ========================================================
 *
 * ALTERE ESTA LINHA
 *
 * Supabase → Connect → Publishable key
 *
 * Tem que começar com:
 *
 * sb_publishable_
 *
 * NÃO COLOQUE sb_secret_
 * NÃO COLOQUE service_role
 *
 * ========================================================
 */

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_YsV_wvI18wbxep-ekR1sag_QUQ9q2U6";



/* =========================================================
   ESTADO DO APP
========================================================= */

let categoriaAtual =
    "gibis";


let filtroAtual =
    "todos";


let biblioteca =
    [];


let progresso =
    {};


let colecaoAberta =
    null;



/* =========================================================
   INICIAR
========================================================= */

document.addEventListener(
    "DOMContentLoaded",

    async function() {


        document
            .getElementById(
                "pesquisa"

                renderizarBiblioteca
            );


        await carregarTudo();

    }
);



/* =========================================================
   CARREGAR TUDO
========================================================= */

async function carregarTudo() {


    mostrarCarregando();


    try {


        await Promise.all([

            carregarBiblioteca(),

            carregarProgresso()

        ]);


        atualizarEstatisticas();


        renderizarBiblioteca();


    } catch (erro) {


        console.error(
            erro
        );


        mostrarErro(
            erro.message
        );

    }

}



/* =========================================================
   CARREGAR BIBLIOTECA DIRETAMENTE DO SUPABASE
========================================================= */

async function carregarBiblioteca() {


    biblioteca = [];


    const limite =
        1000;


    let offset =
        0;


    while (true) {


        const url =

            SUPABASE_URL +

            "/rest/v1/biblioteca" +

            "?select=*" +

            "&categoria=eq." +
            encodeURIComponent(
                categoriaAtual
            ) +

            "&encontrado_no_drive=eq.true" +

            "&order=pasta_nome.asc,nome.asc" +

            "&limit=" +
            limite +

            "&offset=" +
            offset;



        const resposta =
            await fetch(

                url,

                {

                    headers: {

                        apikey:
                            SUPABASE_PUBLISHABLE_KEY

                    }

                }

            );



        if (!resposta.ok) {


            const texto =
                await resposta.text();


            throw new Error(

                "Supabase HTTP " +

                resposta.status +

                ": " +

                texto

            );

        }



        const dados =
            await resposta.json();



        if (

            !dados ||

            dados.length === 0

        ) {

            break;

        }



        biblioteca.push(
            ...dados
        );



        if (
            dados.length <
            limite
        ) {

            break;

        }



        offset +=
            limite;

    }

}



/* =========================================================
   CARREGAR PROGRESSO
========================================================= */

async function carregarProgresso() {


    progresso =
        {};


    const resposta =
        await fetch(

            SUPABASE_URL +

            "/rest/v1/progresso?select=*",

            {

                headers: {

                    apikey:
                        SUPABASE_PUBLISHABLE_KEY

                }

            }

        );



    if (!resposta.ok) {


        const erro =
            await resposta.text();


        console.warn(

            "Não foi possível carregar progresso:",

            erro

        );


        return;

    }



    const dados =
        await resposta.json();



    dados.forEach(

        function(item) {


            progresso[
                item.file_id
            ] = item;


        }

    );

}



/* =========================================================
   AGRUPAR POR PASTA
========================================================= */

function gerarColecoes() {


    const mapa =
        {};


    biblioteca.forEach(

        function(item) {


            const pastaId =
                item.pasta_id;


            if (!mapa[pastaId]) {


                mapa[pastaId] = {

                    id:
                        pastaId,

                    nome:
                        item.pasta_nome ||
                        "Sem nome",

                    itens:
                        [],

                    capa:
                        null

                };

            }



            mapa[
                pastaId
            ].itens.push(
                item
            );



            if (

                !mapa[
                    pastaId
                ].capa &&

                item.capa_url

            ) {


                mapa[
                    pastaId
                ].capa =
                    item.capa_url;

            }

        }

    );


    return Object.values(
        mapa
    );

}



/* =========================================================
   FILTRAR
========================================================= */

function colecaoPassaFiltro(
    colecao
) {


    if (
        filtroAtual ===
        "todos"
    ) {

        return true;

    }



    return colecao.itens.some(

        function(item) {


            const p =
                progresso[
                    item.file_id
                ];


            if (!p) {

                return false;

            }



            if (
                filtroAtual ===
                "favoritos"
            ) {


                return (
                    p.favorito ===
                    true
                );

            }



            return (
                p.status ===
                filtroAtual
            );

        }

    );

}



/* =========================================================
   RENDERIZAR BIBLIOTECA
========================================================= */

function renderizarBiblioteca() {


    const grid =
        document.getElementById(
            "libraryGrid"
        );


    const busca =
        document
            .getElementById(
                "pesquisa"
            )
            .value
            .trim()
            .toLowerCase();



    let colecoes =
        gerarColecoes();



    colecoes =
        colecoes.filter(

            function(colecao) {


                if (
                    !colecaoPassaFiltro(
                        colecao
                    )
                ) {

                    return false;

                }



                if (!busca) {

                    return true;

                }



                if (
                    colecao.nome
                        .toLowerCase()
                        .includes(busca)
                ) {

                    return true;

                }



                return colecao.itens.some(

                    function(item) {


                        return item.nome
                            .toLowerCase()
                            .includes(
                                busca
                            );

                    }

                );

            }

        );



    ordenarColecoes(
        colecoes
    );



    if (
        colecoes.length ===
        0
    ) {


        grid.innerHTML =
            `

            <div class="state">

                <div class="state-icon">
                    📭
                </div>

                Nenhuma coleção encontrada.

            </div>

            `;


        return;

    }



    grid.innerHTML =
        "";



    colecoes.forEach(

        function(colecao) {


            grid.appendChild(

                criarCardColecao(
                    colecao
                )

            );

        }

    );

}



/* =========================================================
   CARD
========================================================= */

function criarCardColecao(
    colecao
) {


    const card =
        document.createElement(
            "article"
        );


    card.className =
        "collection-card";



    const total =
        colecao.itens.length;



    let lidos =
        0;


    let favoritos =
        0;



    colecao.itens.forEach(

        function(item) {


            const p =
                progresso[
                    item.file_id
                ];


            if (
                p?.status ===
                "lido"
            ) {

                lidos++;

            }


            if (
                p?.favorito ===
                true
            ) {

                favoritos++;

            }

        }

    );



    const percentual =
        total > 0

            ? Math.round(
                (
                    lidos /
                    total
                )
                * 100
            )

            : 0;



    let capaHtml;


    if (
        colecao.capa
    ) {


        capaHtml =
            `

            <img

                src="${escapeHtml(
                    colecao.capa
                )}"

                loading="lazy"

                alt="Capa"

                onerror="
                    this.style.display='none';
                    this.nextElementSibling.style.display='flex';
                "

            >


            <div
                class="cover-placeholder"
                style="display:none"
            >

                <div class="placeholder-icon">
                    📚
                </div>

                <div class="placeholder-name">

                    ${escapeHtml(
                        colecao.nome
                    )}

                </div>

            </div>

            `;


    } else {


        capaHtml =
            `

            <div class="cover-placeholder">

                <div class="placeholder-icon">
                    📚
                </div>

                <div class="placeholder-name">

                    ${escapeHtml(
                        colecao.nome
                    )}

                </div>

            </div>

            `;

    }



    card.innerHTML =
        `

        <div class="cover">


            ${capaHtml}


            <div class="cover-count">

                ${total}
                ed.

            </div>


            ${
                favoritos > 0

                    ? `
                    <div class="cover-star">
                        ⭐
                    </div>
                    `

                    : ""
            }


        </div>


        <div class="collection-info">


            <div
                class="collection-title"

                title="${escapeHtml(
                    colecao.nome
                )}"
            >

                ${escapeHtml(
                    colecao.nome
                )}

            </div>


            <div class="collection-meta">

                ${lidos}
                de
                ${total}
                lidos

            </div>


            <div class="progress-bar">

                <div
                    class="progress-fill"

                    style="
                        width:
                        ${percentual}%
                    "
                >
                </div>

            </div>


        </div>

        `;



    card.addEventListener(

        "click",

        function() {

            abrirColecao(
                colecao
            );

        }

    );


    return card;

}



/* =========================================================
   ORDENAÇÃO
========================================================= */

function ordenarColecoes(
    colecoes
) {


    const tipo =
        document
            .getElementById(
                "ordenacao"
            )
            .value;



    if (
        tipo ===
        "quantidade"
    ) {


        colecoes.sort(

            function(a,b) {

                return (
                    b.itens.length -
                    a.itens.length
                );

            }

        );


        return;

    }



    if (
        tipo ===
        "recente"
    ) {


        colecoes.sort(

            function(a,b) {


                return (
                    obterUltimaLeitura(b) -
                    obterUltimaLeitura(a)
                );

            }

        );


        return;

    }



    colecoes.sort(

        function(a,b) {


            return a.nome.localeCompare(

                b.nome,

                "pt-BR",

                {

                    numeric:
                        true,

                    sensitivity:
                        "base"

                }

            );

        }

    );

}



/* =========================================================
   ÚLTIMA LEITURA
========================================================= */

function obterUltimaLeitura(
    colecao
) {


    let maior =
        0;


    colecao.itens.forEach(

        function(item) {


            const data =
                progresso[
                    item.file_id
                ]?.ultima_leitura;


            if (!data) {

                return;

            }


            const timestamp =
                new Date(
                    data
                ).getTime();


            if (
                timestamp >
                maior
            ) {

                maior =
                    timestamp;

            }

        }

    );


    return maior;

}



/* =========================================================
   ABRIR COLEÇÃO
========================================================= */

function abrirColecao(
    colecao
) {


    colecaoAberta =
        colecao;



    document
        .getElementById(
            "modalTitle"
        )
        .textContent =
            colecao.nome;



    document
        .getElementById(
            "modalSubtitle"
        )
        .textContent =

            colecao.itens.length +

            " arquivo(s) • " +

            (
                categoriaAtual ===
                "gibis"

                ? "Gibis / HQs"

                : "Mangás"
            );



    renderizarItensModal();



    document
        .getElementById(
            "modal"
        )
        .classList
        .add(
            "open"
        );



    document.body.style.overflow =
        "hidden";

}



/* =========================================================
   RENDER MODAL
========================================================= */

function renderizarItensModal() {


    if (!colecaoAberta) {

        return;

    }



    const body =
        document.getElementById(
            "modalBody"
        );



    const itens =
        [

        ];



    itens.sort(

        function(a,b) {


            return a.nome.localeCompare(

                b.nome,

                "pt-BR",

                {

                    numeric:
                        true,

                    sensitivity:
                        "base"

                }

            );

        }

    );



    body.innerHTML =
        "";



    itens.forEach(

        function(item) {


            body.appendChild(

                criarEdicao(
                    item

            );

        }

    );

}



/* =========================================================
   CRIAR EDIÇÃO
========================================================= */

            0
        );

        Number(

        );

        p.favorito ===
        true;

        );

    div.innerHTML =

            )}

                )}"
            >

                ${escapeHtml(

            </div>

                        ""
                    )
                    .toUpperCase()
                }

                •

            <div class="page-control">

                </span>

                    min="0"

                >

                        )
                    "
                >

                </button>

        </div>


        <div class="edition-actions">

                            item.drive_url
                        )}'
                    )
                "

            >
                📖
            </button>


            <button

                "

            </button>

                    )
                "

                title="Quero ler"
            >
                🔖
            </button>


            <button

                class="small-button"

                onclick="
                    alterarStatus(
                        '${item.file_id}',
                        'lido'
                    )
                "

                title="Lido"

            </button>


            <button

                class="small-button"

                    )

                title="Não lido"
            >
                ↩️
            </button>


            <button

                onclick="

                title="Favorito"
            >

                ${
                    favorito
                        ? "⭐"
                        : "☆"
                }

        </div>

        `;


    return div;

}



/* =========================================================
   SALVAR PROGRESSO
========================================================= */

async function salvarProgresso(
    fileId,
    alteracoes
) {


    const existente =
        progresso[
            fileId
        ] || {};



    const registro = {


        file_id:
            fileId,


        status:

            alteracoes.status ??

            existente.status ??

            "nao_lido",


        pagina_atual:

            alteracoes.pagina_atual ??

            existente.pagina_atual ??

            0,


        total_paginas:

            alteracoes.total_paginas ??

            existente.total_paginas ??

            0,


        favorito:

            alteracoes.favorito ??

            existente.favorito ??

            false,


        capa_url:

            existente.capa_url ??

            null,


        ultima_leitura:

            new Date()
                .toISOString()

    };



    const resposta =
        await fetch(

            SUPABASE_URL +

            "/rest/v1/progresso",

            {

                method:
                    "POST",


                headers: {

                    apikey:
                        SUPABASE_PUBLISHABLE_KEY,

                    "Content-Type":
                        "application/json",

                    Prefer:
                        "resolution=merge-duplicates,return=minimal"

                },


                body:
                    JSON.stringify(
                        registro
                    )

            }

        );



    if (!resposta.ok) {


        console.error(
            await resposta.text()
        );


        toast(
            "Erro ao salvar o progresso."
        );


        return false;

    }



    progresso[
        fileId
    ] = registro;



    return true;

}



/* =========================================================
   ALTERAR STATUS
========================================================= */

async function alterarStatus(
    fileId,
    status
) {


    const ok =
        await salvarProgresso(

            fileId,

            {
                status:
                    status
            }

        );



    if (!ok) {

        return;

    }



    toast(

        "Marcado como " +

        nomeStatus(
            status
        )

    );



    atualizarEstatisticas();


    renderizarItensModal();


    renderizarBiblioteca();

}



/* =========================================================
   FAVORITO
========================================================= */

async function alternarFavorito(
    fileId
) {


    const atual =
        progresso[
            fileId
        ]?.favorito ===
        true;



    const ok =
        await salvarProgresso(

            fileId,

            {

                favorito:
                    !atual

            }

        );



    if (!ok) {

        return;

    }



    toast(

        !atual

            ? "Adicionado aos favoritos ⭐"

            : "Removido dos favoritos"

    );



    renderizarItensModal();


    renderizarBiblioteca();

}



/* =========================================================
   SALVAR PÁGINAS
========================================================= */

async function salvarPaginas(
    fileId
) {


    const pagina =
        Number(

            document
                .getElementById(
                    "pagina_" +
                    fileId
                )
                .value ||

            0

        );



    const total =
        Number(

            document
                .getElementById(
                    "total_" +
                    fileId
                )
                .value ||

            0

        );



    let status =

        progresso[
            fileId
        ]?.status ||

        "nao_lido";



    if (

        pagina > 0 &&

        status ===
        "nao_lido"

    ) {

        status =
            "lendo";

    }



    if (

        total > 0 &&

        pagina >= total

    ) {

        status =
            "lido";

    }



    const ok =
        await salvarProgresso(

            fileId,

            {

                pagina_atual:
                    pagina,

                total_paginas:
                    total,

                status:
                    status

            }

        );



    if (!ok) {

        return;

    }



    toast(
        "Progresso salvo."
    );



    atualizarEstatisticas();


    renderizarItensModal();


    renderizarBiblioteca();

}



/* =========================================================
   ESTATÍSTICAS
========================================================= */

function atualizarEstatisticas() {


    const colecoes =
        gerarColecoes();



    let lidos =
        0;


    let lendo =
        0;



    biblioteca.forEach(

        function(item) {


            const status =
                progresso[
                    item.file_id
                ]?.status;



            if (
                status ===
                "lido"
            ) {

                lidos++;

            }



            if (
                status ===
                "lendo"
            ) {

                lendo++;

            }

        }

    );



    document
        .getElementById(
            "statColecoes"
        )
        .textContent =
            colecoes.length;



    document
        .getElementById(
            "statArquivos"
        )
        .textContent =
            biblioteca.length;



    document
        .getElementById(
            "statLidos"
        )
        .textContent =
            lidos;



    document
        .getElementById(
            "statLendo"
        )
        .textContent =
            lendo;

}



/* =========================================================
   MUDAR CATEGORIA
========================================================= */

async function mudarCategoria(
    categoria
) {


    categoriaAtual =
        categoria;



    filtroAtual =
        "todos";



    document
        .getElementById(
            "menuGibis"
        )
        .classList
        .toggle(
            "active",
            categoria ===
            "gibis"
        );



    document
        .getElementById(
            "menuMangas"
        )
        .classList
        .toggle(
            "active",
            categoria ===
            "mangas"
        );



    document
        .getElementById(
            "tituloPagina"
        )
        .textContent =

            categoria ===
            "gibis"

                ? "Gibis / HQs"

                : "Mangás";



    document
        .getElementById(
            "pesquisa"
        )
        .value =
            "";



    atualizarFiltroVisual();


    fecharMenuMobile();


    await carregarTudo();

}



/* =========================================================
   FILTRO
========================================================= */

function selecionarFiltro(
    filtro
) {


    filtroAtual =
        filtro;


    atualizarFiltroVisual();


    renderizarBiblioteca();


    fecharMenuMobile();

}



/* =========================================================
   VISUAL DOS FILTROS
========================================================= */

function atualizarFiltroVisual() {


    document
        .querySelectorAll(
            ".chip"
        )
        .forEach(

            function(elemento) {


                elemento
                    .classList
                    .toggle(

                        "active",

                        elemento.dataset
                            .filter ===
                        filtroAtual

                    );

            }

        );



    const mapa = {


        todos:
            "menuTodos",


        lendo:
            "menuLendo",


        quero_ler:
            "menuQuero",


        lido:
            "menuLidos",


        favoritos:
            "menuFavoritos"

    };



    [

        "menuTodos",

        "menuLendo",

        "menuQuero",

        "menuLidos",

        "menuFavoritos"

    ].forEach(

        function(id) {


            document
                .getElementById(
                    id
                )
                .classList
                .remove(
                    "active"
                );

        }

    );



    if (
        mapa[
            filtroAtual
        ]
    ) {


        document
            .getElementById(

                mapa[
                    filtroAtual
                ]

            )
            .classList
            .add(
                "active"
            );

    }

}



/* =========================================================
   SINCRONIZAR DRIVE
========================================================= */

function sincronizarDrive() {


    const url =

        URL_API +

        "?acao=sincronizar&tipo=" +

        encodeURIComponent(
            categoriaAtual
        );



    window.open(

        url,

        "_blank"

    );



    toast(

        "A sincronização foi aberta em outra aba. Quando terminar, volte aqui e clique em Atualizar."

    );

}



/* =========================================================
   ATUALIZAR ESTANTE
========================================================= */

async function recarregarBiblioteca() {


    toast(
        "Atualizando estante..."
    );


    await carregarTudo();


    toast(
        "Estante atualizada."
    );

}



/* =========================================================
   ABRIR ARQUIVO
========================================================= */

function abrirArquivo(
    url
) {


    if (!url) {

        toast(
            "Arquivo sem URL."
        );

        return;

    }


    window.open(

        url,

        "_blank",

        "noopener,noreferrer"

    );

}



/* =========================================================
   FECHAR MODAL
========================================================= */

function fecharModal() {


    document
        .getElementById(
            "modal"
        )
        .classList
        .remove(
            "open"
        );


    document.body.style.overflow =
        "";

}



/* =========================================================
   CLIQUE FORA DO MODAL
========================================================= */

document
    .getElementById(
        "modal"
    )
    .addEventListener(

        "click",

        function(event) {


            if (
                event.target.id ===
                "modal"
            ) {

                fecharModal();

            }

        }

    );



/* =========================================================
   ESC
========================================================= */

document.addEventListener(

    "keydown",

    function(event) {


        if (
            event.key ===
            "Escape"
        ) {

            fecharModal();

        }

    }

);



/* =========================================================
   MENU MOBILE
========================================================= */

function alternarMenu() {


    document
        .getElementById(
            "sidebar"
        )
        .classList
        .toggle(
            "open"
        );

}



function fecharMenuMobile() {


    if (
        window.innerWidth <=
        1000
    ) {


        document
            .getElementById(
                "sidebar"
            )
            .classList
            .remove(
                "open"
            );

}



/* =========================================================
   STATUS EM TEXTO
========================================================= */

    );

/* =========================================================
   ÍCONE DE FORMATO
========================================================= */

function iconeFormato(
    extensao
) {


    extensao =
        String(
            extensao ||
            ""
        )
        .toLowerCase();



    if (
        extensao ===
        "pdf"
    ) {

        return "📕";

    }



    if (

        extensao ===
        "cbz" ||

        extensao ===
        "cbr" ||

        extensao ===
        "cb7"

    ) {

        return "📖";

    }



    if (

        extensao ===
        "epub" ||

        extensao ===
        "mobi"

    ) {

        return "📘";

    }



    return "📚";

}



/* =========================================================
   FORMATAR TAMANHO
========================================================= */

function formatarTamanho(
    bytes
) {


    bytes =
        Number(
            bytes ||
            0
        );



    if (
        bytes <= 0
    ) {

        return "0 MB";

    }



    const mb =

        bytes /

        1024 /

        1024;



    if (
        mb < 1024
    ) {


        return (

            mb.toFixed(1) +

            " MB"

        );

    }



    return (

        (
            mb /
            1024
        )
        .toFixed(2) +

        " GB"

    );

}



/* =========================================================
   ESCAPAR HTML
========================================================= */

function escapeHtml(
    texto
) {


    return String(
        texto ??
        ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}



/* =========================================================
   ESCAPAR JS
========================================================= */

function escapeJs(
    texto
) {


    return String(
        texto ??
        ""
    )

    .replace(
        /\\/g,
        "\\\\"
    )

    .replace(
        /'/g,
        "\\'"
    );

}

/* =========================================================
   TOAST
========================================================= */

function toast(
    mensagem
) {


    const container =
        document.getElementById(
            "toastContainer"
        );



    const elemento =
        document.createElement(
            "div"
        );


    elemento.className =
        "toast";


    elemento.textContent =
        mensagem;



    container.appendChild(
        elemento
    );



    setTimeout(

        function() {

            elemento.remove();

        },

        4000

    );

}
